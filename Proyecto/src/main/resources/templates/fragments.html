<!-- src/main/resources/templates/fragments.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

</head>
<body>

    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">

                <span class="me-2">
                    <img src="/images/logo.png" alt="Logo" width="30" height="30" class="d-inline-block align-text-top">
                    <span>Sistema Bibliotecario</span>
                </span>
                
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                    aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/lendings}">Préstamos</a>
                    </li>
                    

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/returns}">Devoluciones</a>
                    </li>
                    

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/users}">Usuarios</a>
                    </li>
                    

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/books}">Libros</a>
                    </li>
                    

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/reports}">Reportes</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Footer como un fragmento -->
    <footer th:fragment="footer" class="bg-light text-center text-lg-start mt-4">
        <div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.2);">
            © 2024 Sistema Bibliotecario
        </div>
    </footer>
</body>
</html>
